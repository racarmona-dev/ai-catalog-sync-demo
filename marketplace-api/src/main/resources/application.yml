server:
  port: 8080

spring:
  application:
    name: marketplace-api
  datasource:
    url: jdbc:mysql://localhost:3306/marketplace_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:demo}
    password: ${DB_PASSWORD:demo}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    sun.rmi.transport.tcp: OFF
