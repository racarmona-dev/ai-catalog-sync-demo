server:
  port: 8081

spring:
  application:
    name: seller-api
  datasource:
    url: jdbc:mysql://localhost:3306/seller_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:demo}
    password: ${DB_PASSWORD:demo}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    sun.rmi.transport.tcp: OFF

n8n:
  webhook-url: ${N8N_WEBHOOK_URL:http://localhost:5678/webhook/catalog-sync}
